---
- hosts: appsrv
  become: true
  tasks:
    - name: Instalar Apache, PHP y Git
      ansible.builtin.dnf:
        name:
          - httpd
          - php
          - php-mysqlnd
          - git
        state: present

    - name: Habilitar y arrancar Apache
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true

    - name: Ajustar permisos de directorio
      ansible.builtin.file:
        path: /var/www/html
        owner: apache
        group: apache
        mode: '0755'
        recurse: true

    - name: Clonar aplicación desde GitHub en /tmp/dbappphp
      ansible.builtin.git:
        repo: "https://github.com/emverdes/dbappphp.git"
        dest: /tmp/dbappphp
        version: main
        force: yes

    - name: Copiar aplicación al document root
      ansible.builtin.copy:
        src: /tmp/dbappphp/
        dest: /var/www/html/
        owner: apache
        group: apache
        mode: '0755'
        remote_src: true

    - name: Crear index.php que incluya cumple.php
      ansible.builtin.copy:
        dest: /var/www/html/index.php
        content: |
          <?php
          require_once 'cumple.php';
          ?>

    - name: Configurar cumple.php con parámetros de conexión
      ansible.builtin.template:
        src: roles/app/templates/config.php.j2
        dest: /var/www/html/cumple.php
        owner: apache
        group: apache
        mode: '0644'

    - name: Permitir HTTP en firewalld
      ansible.posix.firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true

    - name: Instalar policycoreutils-python-utils (para semanage)
      ansible.builtin.dnf:
        name: policycoreutils-python-utils
        state: present

    - name: Configurar contexto SELinux para aplicación
      ansible.builtin.command: semanage fcontext -a -t httpd_sys_content_t "/var/www/html(/.*)?"
      args:
        creates: /etc/selinux/targeted/contexts/files/file_contexts.local

    - name: Aplicar contexto SELinux
      ansible.builtin.command: restorecon -Rv /var/www/html

    - name: Habilitar booleanos SELinux para conexiones de Apache
      ansible.builtin.command: setsebool -P httpd_can_network_connect on

    - name: Habilitar booleano SELinux para conexiones DB
      ansible.builtin.command: setsebool -P httpd_can_network_connect_db on

- name: Configurar servidor de base de datos (Ubuntu)
  hosts: db
  become: true
  tasks:
    - name: Instalar MariaDB
      ansible.builtin.apt:
        name:
          - mariadb-server
          - python3-pymysql
          - ufw
        state: present
        update_cache: true

    - name: Permitir conexiones SSH en UFW desde el controlador
      community.general.ufw:
        rule: allow
        proto: tcp
        src: "{{ controller_ip }}"
        port: "22"

    - name: Habilitar y arrancar MariaDB
      ansible.builtin.service:
        name: mariadb
        enabled: true
        state: started

    - name: Configurar /root/.my.cnf para MariaDB
      ansible.builtin.copy:
        dest: /root/.my.cnf
        content: |
          [client]
          user=root
          password={{ mysql_root_password }}
        owner: root
        group: root
        mode: '0600'

    - name: Crear usuario admin para Ansible
      ansible.mysql.mysql_user:
        name: admin
        password: "{{ mysql_root_password }}"
        priv: "*.*:ALL,GRANT"
        host: "%"
        state: present
        check_implicit_admin: true

    - name: Crear base de datos
      ansible.mysql.mysql_db:
        name: "{{ db_name }}"
        state: present
        login_user: admin
        login_password: "{{ mysql_root_password }}"

    - name: Crear usuario de aplicación
      ansible.mysql.mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        priv: "{{ db_name }}.*:ALL PRIVILEGES"
        host: "{{ hostvars['appsrv'].ansible_host }}"
        state: present
        login_user: admin
        login_password: "{{ mysql_root_password }}"

    - name: Generar SQL inicial
      ansible.builtin.template:
        src: roles/db/templates/cumpleanios.sql.j2
        dest: /tmp/cumpleanios.sql

    - name: Importar datos iniciales
      ansible.mysql.mysql_db:
        name: "{{ db_name }}"
        state: import
        target: /tmp/cumpleanios.sql
        login_user: admin
        login_password: "{{ mysql_root_password }}"

    - name: Configurar MariaDB para conexiones remotas
      ansible.builtin.lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
      notify: restart mariadb

    - name: Permitir MariaDB desde servidor de aplicación
      community.general.ufw:
        rule: allow
        proto: tcp
        src: "{{ hostvars['appsrv'].ansible_host }}"
        port: "3306"

    - name: Permitir MariaDB desde el controlador (Equipo Ansible)
      community.general.ufw:
        rule: allow
        proto: tcp
        src: "{{ controller_ip }}"
        port: "3306"

  handlers:
    - name: restart mariadb
      ansible.builtin.service:
        name: mariadb
        state: restarted
...
