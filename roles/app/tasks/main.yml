---
  - name: Instalar Apache, PHP y Git
    ansible.builtin.dnf:
      name:
        - httpd
        - php
        - php-mysqlnd
        - git
        - policycoreutils-python-utils
      state: present

  - name: Habilitar y arrancar Apache
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true

  - name: Clonar aplicación desde GitHub en /tmp/dbappphp
    ansible.builtin.git:
      repo: "https://github.com/emverdes/dbappphp.git"
      dest: /tmp/dbappphp
      version: main
      force: yes

  - name: Copiar aplicación al document root
    ansible.builtin.copy:
      src: /tmp/dbappphp/
      dest: /var/www/html/
      owner: apache
      group: apache
      remote_src: true

  - name: Crear index.php que incluya cumple.php
    ansible.builtin.copy:
      dest: /var/www/html/index.php
      content: |
        <?php
        require_once 'cumple.php';
        ?>

  - name: Configurar cumple.php con parámetros de conexión
    ansible.builtin.lineinfile:
      path: /var/www/html/cumple.php
      search_string: '$conexion = new mysqli("IP_DEL_NODO2", "intranet_user", "claveSegura", "intranet");'
      line: "$conexion = new mysqli('{{ hostvars['dbsrv'].ansible_host }}', '{{ db_user }}', '{{ db_password }}', '{{ db_name }}');"
    notify: restart httpd

  - name: Ajuste de linea en cumple.php
    ansible.builtin.lineinfile:
      path: /var/www/html/cumple.php
      search_string: '$resultado = $conexion->query("SELECT nombre, fecha FROM cumpleaños ORDER BY MONTH(fecha), DAY(fecha)");'
      line: '$resultado = $conexion->query("SELECT nombre, fecha FROM cumpleanios ORDER BY MONTH(fecha), DAY(fecha)");'

  - name: Ajuste de permisos index.php y cumple.php
    ansible.builtin.file:
      path: "{{ item }}"
      owner: apache
      group: apache
      mode: '0644'
    loop:
      - /var/www/html/cumple.php
      - /var/www/html/index.php
  
  - name: Configurar permisos de documentación
    ansible.builtin.file:
      path: "{{ item }}"
      owner: apache
      group: apache
      mode: '0640'
    loop:
      - /var/www/html/README.md
      - /var/www/html/LICENSE

  - name: Configurar permisos de cumpleanios.sql
    ansible.builtin.file:
      path: "/var/www/html/cumpleanios.sql"
      owner: apache
      group: apache
      mode: '0600'

  - name: Permitir HTTP en firewalld
    ansible.posix.firewalld:
      service: http
      permanent: true
      state: enabled
      immediate: true

  - name: Configurar contexto SELinux para aplicación
    community.general.sefcontext:
      target: '/var/www/html(/.*)?'
      setype: httpd_sys_content_t
      state: present
    register: selinux_context

  - name: Aplicar contexto SELinux (restorecon)
    ansible.builtin.command: restorecon -Rv /var/www/html
    when: selinux_context.changed
    changed_when: true

  - name: Habilitar booleanos SELinux para conexiones de Apache y DB
    ansible.builtin.seboolean:
      name: "{{ item }}"
      state: true
      persistent: true
    loop:
      - httpd_can_network_connect
      - httpd_can_network_connect_db

  - name: CHECK - Realizar petición HTTP local para validar Apache y PHP
    ansible.builtin.uri:
      url: "http://localhost/"
      return_content: true
    register: web_check
    failed_when: "'Lista de Cumpleaños' not in web_check.content"
    changed_when: false

  - name: CHECK - Confirmar éxito del servidor Web
    ansible.builtin.debug:
      msg: "¡Éxito! La aplicación web responde correctamente y contiene la lista de cumpleaños."


...
