---
  - name: Instalar MariaDB
    ansible.builtin.apt:
      name:
        - mariadb-server
        - python3-pymysql
        - ufw
        - git
      state: present
      update_cache: true

  - name: Clonar aplicación desde GitHub en /tmp/dbappphp
    ansible.builtin.git:
      repo: "https://github.com/emverdes/dbappphp.git"
      dest: /tmp/dbappphp
      version: main
      force: yes

  - name: Permitir conexiones SSH en UFW desde el controlador
    community.general.ufw:
      rule: allow
      proto: tcp
      src: "{{ controller_ip }}"
      port: "22"
     
  - name: Habilitar UFW
    community.general.ufw:
      state: enabled

  - name: Habilitar y arrancar MariaDB
    ansible.builtin.service:
      name: mariadb
      enabled: true
      state: started

