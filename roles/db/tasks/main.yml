---

- name: Instalar MariaDB
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present
    update_cache: true

- name: Habilitar MariaDB
  ansible.builtin.service:
    name: mariadb
    enabled: true
    state: started

- name: Crear usuario admin para Ansible
  ansible.mysql.mysql_user:
    name: luca
    password: "{{ admin_password }}"
    priv: "*.*:ALL,GRANT"
    host: "%"
    state: present
    login_user: root
    login_password: "{{ admin_password }}"

- name: Crear base de datos
  ansible.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present

- name: Crear usuario de aplicación
  ansible.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    priv: "{{ db_name }}.*:ALL"
    host: "%"
    state: present
    login_user: root
    login_password: "{{ ansible_mysql_password }}"

- name: Copiar SQL
  ansible.builtin.copy:
    src: cumpleanios.sql
    dest: /tmp/cumpleanios.sql

- name: Importar datos
  ansible.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: /tmp/cumpleanios.sql

- name: Permitir conexiones remotas
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^bind-address'
    line: 'bind-address = 0.0.0.0'
  notify: restart mariadb

- name: Permitir MariaDB desde el servidor de aplicación
  community.general.ufw:
    rule: allow
    proto: tcp
    src: 192.168.1.20
    port: "3306"

...
